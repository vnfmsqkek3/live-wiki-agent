name: ci-data
on:
  pull_request:
    paths: ["packages/legal-parser/**", "tests/fixtures/**"]
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 파서 정답 비교는 legal-parser 의 test 스크립트가 tests/fixtures/legal 을 읽어 수행 (Owner let522mj)
      - run: npm test -w packages/legal-parser --if-present
