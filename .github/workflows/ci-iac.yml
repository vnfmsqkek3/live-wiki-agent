name: ci-iac
on:
  pull_request:
    paths: ["hanaeum-terraform/**"]
permissions:
  contents: read
jobs:
  iac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanaeum-terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
      - run: terraform fmt -check -recursive
      # CI 는 AWS 에 접근하지 않는다 (backend 없이 validate)
      - run: |
          for d in envs/*/; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: hanaeum-terraform
          framework: terraform
          quiet: true
          soft_fail: true # ponytail: 경고만. MVP 안정화 후 skip 목록을 정리하고 hard fail 로 전환
